name: Export starter pool

# Вручную: общий пул → src/data/starter-pool.json (стартовый набор для новых баз и режима «на устройстве»).
# Берётся из последней серверной копии (repo polevoy-backups) — база не читается, лимит Firestore не тратится.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: kukilvan/polevoy-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backups
      - run: node scripts/starter-from-backup.mjs backups src/data/starter-pool.json
      - name: Сохранить
        run: |
          git config user.name "pool-bot"
          git config user.email "pool-bot@users.noreply.github.com"
          git add src/data/starter-pool.json
          git diff --cached --quiet || (git commit -m "Стартовый набор: обновлён из общего пула" && git push)
