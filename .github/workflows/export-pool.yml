name: Export starter pool

# Вручную: копия общего пула → src/data/starter-pool.json (стартовый набор открытой версии «Менеджер проектов»)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save firebase-admin@13
      - run: node scripts/export-pool.mjs src/data/starter-pool.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Сохранить
        run: |
          git config user.name "pool-bot"
          git config user.email "pool-bot@users.noreply.github.com"
          git add src/data/starter-pool.json
          git diff --cached --quiet || (git commit -m "Стартовый набор: обновлён из общего пула" && git push)
